[project]
name = "course-dropoff-analysis"
version = "1.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# findings.md is written as long f-string sentences; wrapping them hurts more than it helps
"dropoff/analysis.py" = ["E501"]
